# FACTORIAL SCREEN -- C2: baseline + photometric/optical augmentation stack
#
# C0 with COMPONENT B switched on and nothing else changed. Every magnitude
# below is the AugConfig default; they are written out in full anyway, because
# a screen arm whose treatment is defined by "whatever the defaults happened to
# be that week" is not reproducible.
#
# The magnitudes sit at roughly 2-3x common library defaults everywhere except
# the colour block, which is constrained by the endoscopic gamut instead -- see
# reports/aug_samples.png (kept) and reports/aug_samples_v1_freecolour.png (the
# rejected first attempt, magenta and olive frames) for why.

seed: 0
repeat: 0
fold: 0

image_size: 384
crop_mode: inscribed_square
cache_size: 431
precision: bf16

batch_size: 32
num_workers: 8
sampler: weighted        # UNCHANGED from C0 -- this arm varies augmentation only

arch: convnext_base.fb_in1k
pretrained: true
grad_checkpointing: false

epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03
deterministic: true

aug:
  # --- baseline, as C0 ---
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5

  # --- master gates: the treatment ---
  photometric: true
  optical: true
  sensor: true
  compression: true

  # --- colour ---
  gamma_p: 0.5
  gamma_m: 0.50              # shared gamma, log-uniform over [1/1.5, 1.5]
  gamma_channel_m: 0.08      # narrow per-channel deviation on top
  white_balance_p: 0.5
  white_balance_m: 0.25      # colour-temperature axis (R up / B down)
  white_balance_tint_frac: 0.34
  hue_sat_p: 0.5
  hue_m: 10.0                # degrees
  sat_m: 0.45

  # --- illumination ---
  vignette_p: 0.5
  vignette_m: 0.55           # corner brightness removed
  linear_gradient_p: 0.5
  linear_gradient_m: 0.35
  radial_gradient_p: 0.3
  radial_gradient_m: 0.35
  specular_p: 0.4
  specular_m: 0.060          # blob radius as a fraction of the frame

  # --- optical ---
  motion_blur_p: 0.3
  motion_blur_m: 21.0        # max odd kernel length, px
  defocus_p: 0.3
  defocus_m: 3.5             # max disc-PSF radius, px
  distortion_p: 0.4
  distortion_m: 0.25         # |k1|, barrel and pincushion
  sharpen_p: 0.3
  sharpen_m: 0.85            # max unsharp alpha

  # --- sensor ---
  gaussian_noise_p: 0.4
  gaussian_noise_m: 22.0     # max sigma, 0-255 units
  poisson_noise_p: 0.3
  poisson_noise_m: 20.0      # photons at full white; SMALLER = noisier
  downsample_p: 0.35
  downsample_m: 0.35         # min scale factor before restoring the size

  # --- compression ---
  jpeg_p: 0.5
  jpeg_q_min: 30
  jpeg_q_max: 95

manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/dg_c2
