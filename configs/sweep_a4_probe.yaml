# A4 LOCO-only probe -- same stack as sweep_a4.yaml, magnitude_scale 0.10.
#
# LOCO ONLY. This config is never run in cv mode. Its purpose is narrow: A2's
# LOCO gain on holdout_center_1 was the only clearly-resolvable effect found
# in the whole magnitude sweep (reports/magnitude_sweep.md section 3), and
# LOCO is the one protocol that can see it at all (pooled-OOF cannot resolve
# any arm against A0 -- see section 0 of that report). This probes whether
# that gain survives at roughly a third of A2's magnitude, and what happens
# on holdout_center_2 at the same time.
#
# The sampler field is carried over from sweep_a4.yaml for consistency, but it
# is inert here: balanced_centre_class collapses to 'weighted' on a
# single-centre LOCO training side (src/data.py), so this run's sampler
# component contributes nothing regardless. What varies against
# runs/sweep_a2_loco is magnitude_scale alone: 0.33 -> 0.10.

seed: 0
repeat: 0
fold: 0

image_size: 384
crop_mode: inscribed_square
cache_size: 431
precision: bf16

batch_size: 32
num_workers: 8
sampler: balanced_centre_class

arch: convnext_base.fb_in1k
pretrained: true
grad_checkpointing: false

epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03
deterministic: true

aug:
  # --- GLOBAL MAGNITUDE MULTIPLIER (the probe's treatment) ---
  magnitude_scale: 0.10

  # --- baseline, as A0 ---
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5

  # --- master gates: the treatment ---
  photometric: true
  optical: true
  sensor: true
  compression: true

  # --- colour ---
  gamma_p: 0.5
  gamma_m: 0.50
  gamma_channel_m: 0.08
  white_balance_p: 0.5
  white_balance_m: 0.25
  white_balance_tint_frac: 0.34
  hue_sat_p: 0.5
  hue_m: 10.0
  sat_m: 0.45

  # --- illumination ---
  vignette_p: 0.5
  vignette_m: 0.55
  linear_gradient_p: 0.5
  linear_gradient_m: 0.35
  radial_gradient_p: 0.3
  radial_gradient_m: 0.35
  specular_p: 0.4
  specular_m: 0.060

  # --- optical ---
  motion_blur_p: 0.3
  motion_blur_m: 21.0
  defocus_p: 0.3
  defocus_m: 3.5
  distortion_p: 0.4
  distortion_m: 0.25
  sharpen_p: 0.3
  sharpen_m: 0.85

  # --- sensor ---
  gaussian_noise_p: 0.4
  gaussian_noise_m: 22.0
  poisson_noise_p: 0.3
  poisson_noise_m: 20.0
  downsample_p: 0.35
  downsample_m: 0.35

  # --- compression ---
  jpeg_p: 0.5
  jpeg_q_min: 30
  jpeg_q_max: 95

manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/sweep_a4_probe
