# pAUC smoke -- 2026-08-07 overnight, BRANCH B, second stage.
#
# configs/sweep_a4_checkpointed.yaml VERBATIM below, with the pauc block
# appended (combined loss lambda*BCE + (1-lambda)*pAUC, squared hinge,
# two-sided restriction, warmup epochs 0-4 then beta 1.0 -> 0.15 over 5-9 --
# src/losses.py holds every rationale) and save_checkpoint back to false
# (this is a smoke: 1 fold x 3 seeds, the question is "does it train without
# divergence or gradient collapse", not "is it good").

# A4 -- checkpointed retrain, 2026-08-05 overnight chain.
#
# configs/sweep_a4.yaml VERBATIM below the model block, and the model block is
# also unchanged -- the ONLY difference from configs/sweep_a4.yaml anywhere in
# this file is save_checkpoint: true and out_dir. This exists because JOB 5a
# found A4 (the accepted, primary ensemble member) has ZERO retained
# checkpoints on disk: every A4 unit ran as a screening run. This retrain
# produces the weights_fp32.pt artefacts needed to actually select A4, and its
# logits are asserted bit-identical against the existing runs/sweep_a4 canonical
# parquets (scripts/39_bit_identity_check.py) -- same seed, same data order,
# same everything except what gets written to disk after the schedule
# completes, so an exact match is the expected and required outcome. A
# mismatch is a HALT, not a warning: it would mean this retrain is not
# actually reproducing the run its numbers are supposed to stand in for.
#
# COMPONENT A and COMPONENT B together, at the magnitude where B showed its
# LOCO gain (A2, s=0.33). Nothing here is new relative to A1/A2: this config
# is A2's aug block verbatim (magnitude_scale 0.33, all four master gates on,
# same probabilities and magnitudes) with A1's sampler substituted in place of
# A2's `weighted`. See reports/a4_pre_registration.md for why this pairing was
# chosen and what decides it.

seed: 0
repeat: 0
fold: 0

image_size: 384
crop_mode: inscribed_square
cache_size: 431
precision: bf16

batch_size: 32
num_workers: 8
sampler: balanced_centre_class   # COMPONENT A

arch: convnext_base.fb_in1k
pretrained: true
grad_checkpointing: false

epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03
deterministic: true

save_checkpoint: false           # smoke run: parquets only

aug:
  # --- GLOBAL MAGNITUDE MULTIPLIER (COMPONENT B, at A2's magnitude) ---
  magnitude_scale: 0.33

  # --- baseline, as A0 ---
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5

  # --- master gates: the treatment ---
  photometric: true
  optical: true
  sensor: true
  compression: true

  # --- colour ---
  gamma_p: 0.5
  gamma_m: 0.50              # shared gamma, log-uniform over [1/1.5, 1.5]
  gamma_channel_m: 0.08      # narrow per-channel deviation on top
  white_balance_p: 0.5
  white_balance_m: 0.25      # colour-temperature axis (R up / B down)
  white_balance_tint_frac: 0.34
  hue_sat_p: 0.5
  hue_m: 10.0                # degrees
  sat_m: 0.45

  # --- illumination ---
  vignette_p: 0.5
  vignette_m: 0.55           # corner brightness removed
  linear_gradient_p: 0.5
  linear_gradient_m: 0.35
  radial_gradient_p: 0.3
  radial_gradient_m: 0.35
  specular_p: 0.4
  specular_m: 0.060          # blob radius as a fraction of the frame

  # --- optical ---
  motion_blur_p: 0.3
  motion_blur_m: 21.0        # max odd kernel length, px
  defocus_p: 0.3
  defocus_m: 3.5             # max disc-PSF radius, px
  distortion_p: 0.4
  distortion_m: 0.25         # |k1|, barrel and pincushion
  sharpen_p: 0.3
  sharpen_m: 0.85            # max unsharp alpha

  # --- sensor ---
  gaussian_noise_p: 0.4
  gaussian_noise_m: 22.0     # max sigma, 0-255 units
  poisson_noise_p: 0.3
  poisson_noise_m: 20.0      # photons at full white; SMALLER = noisier
  downsample_p: 0.35
  downsample_m: 0.35         # min scale factor before restoring the size

  # --- compression ---
  jpeg_p: 0.5
  jpeg_q_min: 30
  jpeg_q_max: 95

manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/pauc_smoke

pauc_enabled: true
pauc_beta: 0.15
pauc_pos_fraction: 0.25
pauc_temperature: 1.0
pauc_margin: 1.0
pauc_lambda: 0.3
pauc_warmup_epochs: 5
pauc_anneal_epochs: 5
