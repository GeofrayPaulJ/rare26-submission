# G3 (RN50 GastroNet-5M DINOv1) + pAUC combined loss.
#
# configs/g3_rn50_gastronet.yaml VERBATIM below the pauc block -- same model,
# same aug stack, same everything G3's own screening run used. Only the loss
# changes: lambda*BCE + (1-lambda)*pAUC (src/losses.py), pauc_enabled=true,
# same hyperparameters already validated clean in the pAUC smoke test
# (reports/pauc_smoke.md, 1 fold x 3 seeds, no divergence/collapse) and used
# for the pAUC-P1 arm (configs/a4_pauc_smoke.yaml). Per
# reports/g3_component_pre_registration.md: pooled run out_dir below
# (queue stage 1); LOCO run uses the same file with run_cv.py's
# --out-dir runs/g3_pauc_loco override (queue stage 2), same convention as
# configs/g3_rn50_gastronet.yaml serving both runs/g3_rn50_gastronet and
# runs/g3_rn50_gastronet_loco.
#
# save_checkpoint left at the default (false): this is a screening run, same
# as G3's own original run, which also kept no checkpoints (scripts/63_g3_checkpoint_retrain.py
# exists precisely because G3's screening run had none). A checkpointed
# retrain is not pre-registered for this arm and is not launched here.

seed: 0
repeat: 0
fold: 0

image_size: 384
crop_mode: inscribed_square
cache_size: 431
precision: bf16

batch_size: 90    # VRAM-probed value for this exact model (RN50/GastroNet,
                  # 384px, this aug stack) -- see configs/g3_checkpointed.yaml's
                  # header for why the literal-32 default is wrong for G3, and
                  # gastronet.md ("Batch size used: 90 (probed, not assumed)").
                  # Same model/resolution/aug as this file, so the same probed
                  # value applies; not re-probed here.
num_workers: 8
sampler: balanced_centre_class   # COMPONENT A

arch: resnet50
pretrained: false            # local checkpoint replaces timm hub weights
init_weights: weights/RN50_GastroNet-5M_DINOv1.pth
grad_checkpointing: false

epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03
deterministic: true

aug:
  # --- GLOBAL MAGNITUDE MULTIPLIER (COMPONENT B, at A2's magnitude) ---
  magnitude_scale: 0.33

  # --- baseline, as A0 ---
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5

  # --- master gates: the treatment ---
  photometric: true
  optical: true
  sensor: true
  compression: true

  # --- colour ---
  gamma_p: 0.5
  gamma_m: 0.50              # shared gamma, log-uniform over [1/1.5, 1.5]
  gamma_channel_m: 0.08      # narrow per-channel deviation on top
  white_balance_p: 0.5
  white_balance_m: 0.25      # colour-temperature axis (R up / B down)
  white_balance_tint_frac: 0.34
  hue_sat_p: 0.5
  hue_m: 10.0                # degrees
  sat_m: 0.45

  # --- illumination ---
  vignette_p: 0.5
  vignette_m: 0.55           # corner brightness removed
  linear_gradient_p: 0.5
  linear_gradient_m: 0.35
  radial_gradient_p: 0.3
  radial_gradient_m: 0.35
  specular_p: 0.4
  specular_m: 0.060          # blob radius as a fraction of the frame

  # --- optical ---
  motion_blur_p: 0.3
  motion_blur_m: 21.0        # max odd kernel length, px
  defocus_p: 0.3
  defocus_m: 3.5             # max disc-PSF radius, px
  distortion_p: 0.4
  distortion_m: 0.25         # |k1|, barrel and pincushion
  sharpen_p: 0.3
  sharpen_m: 0.85            # max unsharp alpha

  # --- sensor ---
  gaussian_noise_p: 0.4
  gaussian_noise_m: 22.0     # max sigma, 0-255 units
  poisson_noise_p: 0.3
  poisson_noise_m: 20.0      # photons at full white; SMALLER = noisier
  downsample_p: 0.35
  downsample_m: 0.35         # min scale factor before restoring the size

  # --- compression ---
  jpeg_p: 0.5
  jpeg_q_min: 30
  jpeg_q_max: 95

manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/g3_pauc

pauc_enabled: true
pauc_beta: 0.15
pauc_pos_fraction: 0.25
pauc_temperature: 1.0
pauc_margin: 1.0
pauc_lambda: 0.3
pauc_warmup_epochs: 5
pauc_anneal_epochs: 5
