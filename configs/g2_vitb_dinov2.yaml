# G2 -- DINOv2 ViT-B/14 (with registers)
#
# Priority 2: architecture diversity. ViT-B/14 verified 85.97M params,
# width 768, 12 blocks, patch 14x14, 4 register tokens.
#
# IMAGE SIZE 378, NOT 384. ViT-B/14 needs a size divisible by 14; 384 is not
# (384/14 = 27.43) and timm silently floors it to a 27x27 grid, discarding the
# last 6 pixels of every image. 378 = 27*14 is an exact fit. This is the only
# deviation from the ConvNeXt A4 arms and it is reported in reports/gastronet.md.
#
# ENSEMBLE DIVERSITY MEMBER, not a backbone replacement. ConvNeXt-Base remains
# primary; this arm exists to add a decorrelated member to the ensemble.
#
# Everything below the model block is configs/sweep_a4.yaml VERBATIM -- the
# accepted arm (centre x class sampler + stack at magnitude_scale 0.33). Only
# arch, image_size, pretrained/init_weights and out_dir differ.

seed: 0
repeat: 0
fold: 0

image_size: 378
crop_mode: inscribed_square
cache_size: 431
precision: bf16

batch_size: 32
num_workers: 8
sampler: balanced_centre_class   # COMPONENT A

arch: vit_base_patch14_reg4_dinov2
pretrained: false            # local checkpoint replaces timm hub weights
init_weights: weights/dinov2.pth
grad_checkpointing: false

epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03
deterministic: true

aug:
  # --- GLOBAL MAGNITUDE MULTIPLIER (COMPONENT B, at A2's magnitude) ---
  magnitude_scale: 0.33

  # --- baseline, as A0 ---
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5

  # --- master gates: the treatment ---
  photometric: true
  optical: true
  sensor: true
  compression: true

  # --- colour ---
  gamma_p: 0.5
  gamma_m: 0.50              # shared gamma, log-uniform over [1/1.5, 1.5]
  gamma_channel_m: 0.08      # narrow per-channel deviation on top
  white_balance_p: 0.5
  white_balance_m: 0.25      # colour-temperature axis (R up / B down)
  white_balance_tint_frac: 0.34
  hue_sat_p: 0.5
  hue_m: 10.0                # degrees
  sat_m: 0.45

  # --- illumination ---
  vignette_p: 0.5
  vignette_m: 0.55           # corner brightness removed
  linear_gradient_p: 0.5
  linear_gradient_m: 0.35
  radial_gradient_p: 0.3
  radial_gradient_m: 0.35
  specular_p: 0.4
  specular_m: 0.060          # blob radius as a fraction of the frame

  # --- optical ---
  motion_blur_p: 0.3
  motion_blur_m: 21.0        # max odd kernel length, px
  defocus_p: 0.3
  defocus_m: 3.5             # max disc-PSF radius, px
  distortion_p: 0.4
  distortion_m: 0.25         # |k1|, barrel and pincushion
  sharpen_p: 0.3
  sharpen_m: 0.85            # max unsharp alpha

  # --- sensor ---
  gaussian_noise_p: 0.4
  gaussian_noise_m: 22.0     # max sigma, 0-255 units
  poisson_noise_p: 0.3
  poisson_noise_m: 20.0      # photons at full white; SMALLER = noisier
  downsample_p: 0.35
  downsample_m: 0.35         # min scale factor before restoring the size

  # --- compression ---
  jpeg_p: 0.5
  jpeg_q_min: 30
  jpeg_q_max: 95

manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/g2_vitb_dinov2
