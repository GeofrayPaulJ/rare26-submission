# A4 -- decisive isolation arm, 2026-08-05 remediation item 5.
#
# configs/sweep_a4_checkpointed.yaml VERBATIM -- current code (src/config.py,
# src/model.py, src/backbones.py, src/io.py, src/train.py all as of today,
# 2026-08-03/05) -- with exactly ONE additional line: `downsample_ceiling_m`
# is set explicitly so that, after with_magnitude_scale()'s interpolation
# (value = identity + s*(shipped - identity), identity=1.0, s=magnitude_scale
# =0.33), the RUNTIME value lands at EXACTLY 0.85 -- the old, pre-2026-07-31
# hardcoded ceiling -- instead of the corrected formula's 0.9505 at this
# magnitude_scale. Solved algebraically: 0.85 = 1.0 + 0.33*(shipped - 1.0)
# => shipped = 1.0 + (0.85 - 1.0) / 0.33 = 0.5454545454545454 (6/11 exactly).
# Verified against src/config.py's own with_magnitude_scale before writing
# this file, not assumed.
#
# PURPOSE. Isolates whether downsample_ceiling_m's corrected formula is what
# moved retrained A4's pooled FPR@90R from 0.0529 (old code, runs/sweep_a4)
# to 0.0280 (current code, unpinned, runs/a4_checkpointed) -- a delta ~2.5x
# the measured across-repeat noise floor. Every OTHER change in the 08-03
# commit (src/backbones.py, src/config.py's other additions, src/io.py,
# src/model.py, src/train.py) stays exactly as current code has it; only
# this ONE parameter is pinned to its pre-07-31 effective value. If the
# pooled FPR@90R lands back near 0.0529, downsample_ceiling_m is confirmed as
# the (or at least a sufficient) cause. If it stays near 0.0280, the cause is
# elsewhere in the 08-03 changes and every pooled-OOF figure computed since
# 31 July needs re-examination. The LOO-4 IQR (0.0102 old / 0.0027 unpinned
# new) is reported alongside the point estimate for the same reason -- if
# pinning does not also restore the IQR, the variance collapse has a
# different, still-unexplained cause.

seed: 0
repeat: 0
fold: 0

image_size: 384
crop_mode: inscribed_square
cache_size: 431
precision: bf16

batch_size: 32
num_workers: 8
sampler: balanced_centre_class   # COMPONENT A

arch: convnext_base.fb_in1k
pretrained: true
grad_checkpointing: false

epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03
deterministic: true

save_checkpoint: true

aug:
  # --- GLOBAL MAGNITUDE MULTIPLIER (COMPONENT B, at A2's magnitude) ---
  magnitude_scale: 0.33

  # --- baseline, as A0 ---
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5

  # --- master gates: the treatment ---
  photometric: true
  optical: true
  sensor: true
  compression: true

  # --- colour ---
  gamma_p: 0.5
  gamma_m: 0.50              # shared gamma, log-uniform over [1/1.5, 1.5]
  gamma_channel_m: 0.08      # narrow per-channel deviation on top
  white_balance_p: 0.5
  white_balance_m: 0.25      # colour-temperature axis (R up / B down)
  white_balance_tint_frac: 0.34
  hue_sat_p: 0.5
  hue_m: 10.0                # degrees
  sat_m: 0.45

  # --- illumination ---
  vignette_p: 0.5
  vignette_m: 0.55           # corner brightness removed
  linear_gradient_p: 0.5
  linear_gradient_m: 0.35
  radial_gradient_p: 0.3
  radial_gradient_m: 0.35
  specular_p: 0.4
  specular_m: 0.060          # blob radius as a fraction of the frame

  # --- optical ---
  motion_blur_p: 0.3
  motion_blur_m: 21.0        # max odd kernel length, px
  defocus_p: 0.3
  defocus_m: 3.5             # max disc-PSF radius, px
  distortion_p: 0.4
  distortion_m: 0.25         # |k1|, barrel and pincushion
  sharpen_p: 0.3
  sharpen_m: 0.85            # max unsharp alpha

  # --- sensor ---
  gaussian_noise_p: 0.4
  gaussian_noise_m: 22.0     # max sigma, 0-255 units
  poisson_noise_p: 0.3
  poisson_noise_m: 20.0      # photons at full white; SMALLER = noisier
  downsample_p: 0.35
  downsample_m: 0.35         # min scale factor before restoring the size
  downsample_ceiling_m: 0.5454545454545454  # PINNED: interpolates to exactly 0.85 at s=0.33

  # --- compression ---
  jpeg_p: 0.5
  jpeg_q_min: 30
  jpeg_q_max: 95

manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/a4_pinned085
