# FACTORIAL SCREEN -- C1: baseline + centre x class balanced sampler
#
# C0 with COMPONENT A switched on and nothing else changed.
#
# WARNING -- THIS ARM IS NOT IDENTIFIABLE ON THE LOCO SPLITS. Both holdout
# splits train on a single centre (holdout_center_1 trains on center_2 only,
# holdout_center_2 on center_1 only), so two of the four (centre, class) strata
# are empty and the sampler's weight vector is element-wise identical to C0's.
# Running this config on a LOCO split reproduces the corresponding C0 run bit
# for bit. tests/test_sampler.py pins that identity. It is here because the
# component is real and does apply to the pooled-OOF splits, where the training
# set holds both centres -- see reports/dg_screen.md.

seed: 0
repeat: 0
fold: 0

image_size: 384
crop_mode: inscribed_square
cache_size: 431
precision: bf16

batch_size: 32
num_workers: 8
sampler: balanced_centre_class   # COMPONENT A

arch: convnext_base.fb_in1k
pretrained: true
grad_checkpointing: false

epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03
deterministic: true

aug:
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5
  photometric: false
  optical: false
  sensor: false
  compression: false

manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/dg_c1
