# Step 3 baseline: plain supervised ConvNeXt-Base at 384, one fold per invocation.
#
# DELIBERATELY UNAMBITIOUS. No EMA, no SAM, no partial-AUC loss, no TTA, no
# ensembling. This config exists to produce a working checkpoint and honest
# timings. Anything that improves the score arrives in a later step, and only
# after the container is green.
#
# The canonical output of a run using this config is the LAST epoch. There is no
# early stopping and there must not be: 30 epochs is a fixed budget, and the
# per-epoch AUC curve this produces is what fixes the global epoch count later.

# --- split selection (override per invocation with --repeat/--fold/--seed) ---
seed: 0
repeat: 0
fold: 0

# --- image pipeline ---
image_size: 384
crop_mode: inscribed_square
cache_size: 431          # RAM cache side; must be >= image_size
precision: bf16          # eval hardware (T4/A10G) has no bf16 -- use fp16 there

# --- loader ---
# batch_size measured by scripts/vram_probe.py, not guessed. See runs/vram_probe.json.
batch_size: 32
num_workers: 8
sampler: weighted        # inverse class frequency, with replacement

# --- model ---
# Fully qualified on purpose: the bare name "convnext_base" resolves to
# fb_in22k_ft_in1k, which is a different (22k-pretrained) initialisation.
arch: convnext_base.fb_in1k
pretrained: true
grad_checkpointing: false

# --- optimisation ---
epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03        # linear warmup over the first 3% of total steps
deterministic: true      # cudnn.benchmark off; reproducible, slightly slower

# --- augmentation: baseline only, photometric/optical land in a later step ---
aug:
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5
  photometric: false
  optical: false

# --- paths ---
manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/convnext_b_384
