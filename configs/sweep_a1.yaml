# MAGNITUDE SWEEP -- A1: centre x class sampler alone
#
# COMPONENT A, no augmentation change. This arm is the one LOCO could not test:
# a pooled-OOF training set holds BOTH centres, so all four (centre, class)
# strata are populated and the sampler does real work.
#
# Its LOCO arm is reused from runs/noise_floor_b, because on a single-centre
# training side this sampler is provably the class-balanced baseline -- verified
# bit-identical, and re-verified before the sweep launches.

seed: 0
repeat: 0
fold: 0

image_size: 384
crop_mode: inscribed_square
cache_size: 431
precision: bf16

batch_size: 32
num_workers: 8
sampler: balanced_centre_class   # COMPONENT A

arch: convnext_base.fb_in1k
pretrained: true
grad_checkpointing: false

epochs: 30
lr: 1.0e-4
weight_decay: 0.05
warmup_frac: 0.03
deterministic: true

aug:
  hflip: true
  hflip_p: 0.5
  normalize_imagenet: true
  random_black_boxes: true
  black_boxes_p: 0.5
  photometric: false
  optical: false
  sensor: false
  compression: false

manifest: manifests/rare25_folds_v2.csv
image_root: 00_source
redaction_stats: manifests/redaction_check.csv
out_dir: runs/sweep_a1
